name: Test YouTube subtitles (5 videos)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  subtitles:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install yt-dlp
        run: python -m pip install --upgrade "yt-dlp[default]"
      - name: Test Russian captions without downloading videos
        shell: bash
        run: |
          mkdir -p subtitle-test
          ids=(CYoCBEy5wqU QtYfPywblUo)
          for id in "${ids[@]}"; do
            echo "::group::Video $id"
            yt-dlp --no-playlist --skip-download --write-subs --write-auto-subs --sub-langs "ru,ru-.*" --sub-format "vtt/best" --output "subtitle-test/%(id)s.%(ext)s" --socket-timeout 15 --retries 2 --extractor-retries 2 "https://www.youtube.com/watch?v=$id" 2>&1 | tee "subtitle-test/$id.log" || true
            echo "::endgroup::"
          done
          python - <<'PY'
          from pathlib import Path
          import json
          folder=Path("subtitle-test")
          results=[]
          for video_id in ["CYoCBEy5wqU","QtYfPywblUo"]:
              files=list(folder.glob(video_id+".*.vtt"))
              results.append({"video_id":video_id,"captions_downloaded":bool(files),"files":[{"name":p.name,"bytes":p.stat().st_size} for p in files]})
          (folder/"results.json").write_text(json.dumps(results,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: subtitle-test-results
          path: subtitle-test/
          retention-days: 3
